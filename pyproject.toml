[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiper"
version = "1.1.0"
description = "Local CLI and console for the Hiper IoT A61 RGB lamp over the Tuya protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "I114rk" }]
keywords = ["tuya", "smart-home", "lighting", "cli", "iot"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = ["tinytuya>=1.13"]

[project.urls]
Homepage = "https://github.com/I114rk/hiper"
Repository = "https://github.com/I114rk/hiper"

[project.scripts]
hiper = "hiper:main"

[tool.setuptools]
py-modules = ["hiper", "shell_ui", "i18n", "lineedit"]
